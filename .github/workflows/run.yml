---
name: Run Tech Docs Monitor
"on":
  schedule:
    - cron: '25 09 * * 1-5'  # 09:25 UTC, Monday to Friday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daniel_the_manual_spaniel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - run: bundle exec rake notify:expired
        env:
          REALLY_POST_TO_SLACK: ${{ secrets.REALLY_POST_TO_SLACK }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
